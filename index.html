<style>
:root{
  --bg:#eef1f4;--panel:#ffffff;--paper:#fbfcfd;--ink:#16202b;--muted:#5d6b78;--line:#d9e0e7;
  --accent:#1f4e79;--accent-ink:#ffffff;--accent-soft:#e3ecf5;
  --err:#b42318;--err-bg:#fdecea;--warn:#a15c00;--warn-bg:#fff4e0;--info:#2e5d8a;--info-bg:#e8f0f8;--ok:#1d7a52;
  --serif:"Times New Roman",Times,Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12171d;--panel:#1a2129;--paper:#1f2730;--ink:#e6ebf0;--muted:#9aa8b5;--line:#2c3742;
  --accent:#7fb0e0;--accent-ink:#0d1620;--accent-soft:#223244;
  --err:#ff8a80;--err-bg:#3a1d1b;--warn:#f0b35c;--warn-bg:#3a2a12;--info:#8fbbe6;--info-bg:#1c2b3b;--ok:#5fd19b;}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-weight:750;font-size:16px;display:flex;align-items:center;gap:9px;margin-right:auto}
.logo{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 12px/1 var(--serif)}
.ver{font-weight:500;font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 13px;cursor:pointer;white-space:nowrap;min-height:40px}
.btn:hover{border-color:var(--accent)}.btn:disabled{opacity:.45}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.btn.small{padding:5px 10px;min-height:32px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--err)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100% - 62px)}
nav.tabs{background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:4px}
nav.tabs button{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:11px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600}
nav.tabs button.on{background:var(--accent-soft);color:var(--ink)}
nav.tabs .n{margin-left:auto;font-size:12px;border-radius:999px;padding:1px 8px;font-weight:700}
.n.err{background:var(--err-bg);color:var(--err)}.n.warn{background:var(--warn-bg);color:var(--warn)}
main{padding:18px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:12.5px;color:var(--muted);font-weight:600}
.f.full{grid-column:1/-1}
input[type=text],input[type=date],input[type=number],select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--paper);width:100%;min-width:0}
textarea{resize:vertical;min-height:96px;font:16px/1.55 var(--serif)}
.issue{outline:2px solid var(--warn);outline-offset:1px}
.issue.err{outline-color:var(--err)}
.imsg{font-size:12.5px;line-height:1.4;padding:6px 9px;border-radius:7px;margin-top:4px}
.imsg.err{background:var(--err-bg);color:var(--err)}.imsg.warn{background:var(--warn-bg);color:var(--warn)}.imsg.info{background:var(--info-bg);color:var(--info)}
.imsg .btn{margin-left:6px}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row .f{flex:1;min-width:150px}
.list>.item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--paper)}
.muted{color:var(--muted);font-size:13px}
/* bölümler */
.sec-layout{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:14px;align-items:start}
.tree{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.tree button{display:flex;gap:6px;width:100%;text-align:left;border:0;background:none;padding:8px 9px;border-radius:8px;cursor:pointer;align-items:baseline}
.tree button.on{background:var(--accent-soft)}
.tree .num{font-weight:700;color:var(--accent);min-width:2.6em;font-variant-numeric:tabular-nums}
.tree .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;flex:none;align-self:center}
.dot.err{background:var(--err)}.dot.warn{background:var(--warn)}
.blk{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--paper)}
.blk-h{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.blk-h .tag{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.4px;margin-right:auto}
.hint{background:var(--accent-soft);border-radius:9px;padding:9px 11px;font-size:13.5px;margin-bottom:12px}
.addbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tbl-ed{overflow:auto;max-width:100%}
.tbl-ed table{border-collapse:collapse}
.tbl-ed td{border:1px solid var(--line);padding:0;min-width:110px}
.tbl-ed td input{border:0;border-radius:0;padding:7px 8px;background:transparent;width:100%}
.tbl-ed tr:first-child td input.h{font-weight:700}
/* kontrol */
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin-bottom:8px}
.chk.err{background:var(--err-bg)}.chk.warn{background:var(--warn-bg)}.chk.info{background:var(--info-bg)}
.chk .ic{font-weight:800;width:18px;text-align:center}
.chk.err .ic{color:var(--err)}.chk.warn .ic{color:var(--warn)}.chk.info .ic{color:var(--info)}
.chk .src{font-size:12px;color:var(--muted)}
.chk .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}
.pill.err{background:var(--err-bg);color:var(--err)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
/* önizleme */
.pv{background:#7b8794;padding:16px;border-radius:12px;overflow:auto}
.pg{background:#fff;color:#000;max-width:794px;margin:0 auto 16px;padding:60px 64px;font:12pt/1.4 var(--serif);position:relative;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pg p{margin:0 0 8px;text-align:justify;text-indent:1.25cm}
.pg h2,.pg h3,.pg h4{font-size:12pt;margin:14px 0 8px;text-indent:1.25cm}
.pg ul{margin:0 0 8px 1.9cm;padding:0}
.pg .c{text-align:center;text-indent:0}.pg .b{font-weight:700}.pg .big{font-size:16pt;margin:60px 0 6px}.pg .cap{font-size:11pt;margin-top:10px}
.pg .gz{text-align:center;font-weight:700;font-size:11pt;margin:-36px 0 24px}.pg .gz:last-child{margin:24px 0 -36px}
.pg table.rt{border-collapse:collapse;margin:6px auto 10px;font-size:10.5pt}
.pg table.rt th,.pg table.rt td{border:1px solid #000;padding:2px 6px;text-align:left;text-indent:0}
.pg table.rt th{background:#f2f2f2;text-align:center}.pg table.rt td.num{text-align:right}
.pg table.kv{width:100%}.pg table.kv th{text-align:left;width:38%;background:none}
.pg .sig{display:flex;justify-content:space-around;text-align:center;margin-top:30px}.pg .sig.one{justify-content:flex-end}.pg .sig div{min-width:180px}
.pg .pno{text-align:center;color:#666;font:11px system-ui;margin-top:24px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none;max-width:90vw}
#toast.show{opacity:.96}
.flash{animation:fl 1.6s ease}
@keyframes fl{0%,40%{box-shadow:0 0 0 4px var(--warn)}100%{box-shadow:none}}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);max-width:560px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.35)}
.types{display:grid;gap:6px;max-height:60vh;overflow:auto}
.types button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer}
.types button:hover{border-color:var(--accent)}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  nav.tabs{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px;position:sticky;top:62px;z-index:15}
  nav.tabs button{padding:9px 11px;flex:none}
  .sec-layout{grid-template-columns:1fr}.tree{position:static;max-height:none}
  main{padding:12px}.pg{padding:28px 22px}
}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}

const VIR_LIKE=new Set(['vir','virKabul','virIade']);
// Kısa hatırlatmalar (kendi ifadelerimle; rehber metni değildir)
const HINTS={

const UNVANLAR=['Vergi Başmüfettişi','Vergi Müfettişi','Vergi Müfettiş Yardımcısı'];
const VERGI_TURLERI=['Gelir Vergisi','Kurumlar Vergisi','Katma Değer Vergisi','Özel Tüketim Vergisi','Gelir (Stopaj) Vergisi','Kurumlar (Stopaj) Vergisi','Geçici Vergi','Damga Vergisi','Banka ve Sigorta Muameleleri Vergisi','Diğer'];

function mkSection(tpl){return{id:uid(),title:tpl.title,hint:tpl.hint,blocks:tpl.text?[{id:uid(),type:'p',text:tpl.text}]:[],children:(tpl.children||[]).map(mkSection)};}
function newReport(type){
  const T=TYPES[type]||TYPES.vir;
  return{
    v:1,type,
    meta:{gizlilik:'HİZMETE ÖZEL',daire:'',tarih:'',sayi:'',vergiTuru:type.startsWith('vir')?'Kurumlar Vergisi':'',konu:'',donem:'',kapsam:'Tam',
      mufettisler:[{ad:'',unvan:'Vergi Müfettişi'}],gorevler:[{birim:'',tarih:'',sayi:'',konu:''}],
      mukellef:{ad:'',vkn:'',vd:'',adres:'',is:'',meslekKodu:'',tel:'',faaliyet:'Faal'},ortaklar:[],
      uzlasma:'Yok',rdk:'Yok',ozelge:'Yok',baslama:'',ekSure:'0',ibrazGun:''},

  };
}

/* ---------------- yardımcılar ---------------- */
const isKurum=R=>/kurumlar/i.test(R.meta.vergiTuru||'');
const mukellefTerim=R=>isKurum(R)?'Mükellef Kurum':'Mükellef';
const lowerFirst=s=>{s=String(s||'');return /^[A-ZÇĞİÖŞÜ]{2}/.test(s)?s:trL(s.slice(0,1))+s.slice(1);};
const mukellefIn=R=>isKurum(R)?'Mükellef Kurumun':'Mükellefin';
function donemTerimi(R){const v=R.meta.vergiTuru||'';if(/^Gelir Vergisi$/.test(v))return 'takvim yılı';if(/^Kurumlar Vergisi$/.test(v))return 'hesap dönemi';return 'vergilendirme dönemi';}
const fmtDate=d=>{if(!d)return '';const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d);return m?`${m[3]}/${m[2]}/${m[1]}`:d;};
const parseNum=s=>{if(s==null)return NaN;s=String(s).trim();if(!s)return NaN;if(/^-?[\d.]+,\d+$/.test(s)||/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');return Number(s);};
const fmtTL=n=>isNaN(n)?'':n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
function fmtCell(s,on){
  s=String(s==null?'':s).trim();if(!on)return s;
  if(/^\d{10,11}$/.test(s)||/^0\d/.test(s))return s; // VKN/TCKN, telefon
  if(/^-?\d{5,9}([.,]\d{1,2})?$/.test(s)||/^-?\d+[.,]\d{1,2}$/.test(s)&&!/^\d{1,2}[.]\d{1,2}$/.test(s)){const n=parseNum(s);if(!isNaN(n))return fmtTL(n);}
  return s;
}
const isNumericCell=s=>/^[-+(]?\s*[\d.,]+\s*(TL|₺|%)?\)?$/.test(String(s).trim())&&/\d/.test(s)&&!/^\d{1,2}[./]\d{1,2}[./]\d{2,4}$/.test(String(s).trim());
function walk(sections,fn,prefix=[],depth=1){sections.forEach((s,i)=>{const num=[...prefix,i+1];fn(s,num,depth);walk(s.children,fn,num,depth+1);});}
const numStr=num=>num.join('.')+'.';
// Başlık biçimi: 1. düzey TAMAMI BÜYÜK, 2. düzey Her Kelimenin İlk Harfi Büyük, 3+ yalnız ilk kelime büyük harfle
const SMALLW=new Set(['ve','ile','veya','ya','da','de','ki','ya da']);
function headingCase(t,depth){
  t=String(t||'').trim();
  if(depth===1)return trU(t);
  if(depth===2)return t.split(/(\s+)/).map((w,i)=>{if(/^\s+$/.test(w)||!w)return w;if(i>0&&SMALLW.has(trL(w)))return trL(w);if(/^[A-ZÇĞİÖŞÜ0-9.\/()-]{2,}$/.test(w))return w;return trU(w[0])+w.slice(1);}).join('');
  return t?trU(t[0])+t.slice(1):t;
}
// Satır içi biçim: **kalın**, *italik*; tırnak içi ifadeler otomatik italik
function parseInline(str,autoItalic){
  const out=[];const re=/\*\*([^*]+)\*\*|\*([^*]+)\*/g;let last=0,m;
  const pushPlain=s=>{if(!s)return;if(!autoItalic){out.push({t:s});return;}
    const q=/(“[^”]*”|"[^"\n]*")/g;let l=0,mm;while((mm=q.exec(s))){if(mm.index>l)out.push({t:s.slice(l,mm.index)});out.push({t:mm[0].replace(/^"/,'“').replace(/"$/,'”'),i:true});l=mm.index+mm[0].length;}
    if(l<s.length)out.push({t:s.slice(l)});};
  while((m=re.exec(str))){pushPlain(str.slice(last,m.index));if(m[1]!=null)out.push({t:m[1],b:true});else out.push({t:m[2],i:true});last=m.index+m[0].length;}
  pushPlain(str.slice(last));
  return out;
}
const linesOf=t=>String(t||'').split(/\n/).map(s=>s.trim()).filter(Boolean);

/* ---------------- Giriş ve Sonuç taslakları ---------------- */
function girisTaslak(R){
  const M=R.meta,K=M.mukellef,mt=mukellefTerim(R),blocks=[];
  const gv=M.gorevler.filter(g=>g.tarih||g.sayi||g.birim);
  const donem=M.donem||'[dönem]',term=donemTerimi(R),vt=M.vergiTuru?trL(M.vergiTuru)+' ':'';
  if(gv.length<=1){
    const g=gv[0]||{};
    blocks.push({id:uid(),type:'p',text:`${g.birim||M.daire||'[birim]'} Daire Başkanlığının ${fmtDate(g.tarih)||'[tarih]'} tarih ve ${g.sayi||'[sayı]'} sayılı görevlendirme yazısı ile ${K.ad||'[mükellef]'} hakkında ${donem} ${term} için ${vt}yönünden ${trL(M.kapsam||'tam')} inceleme yapılması istenilmiştir.`});
  }else{
    blocks.push({id:uid(),type:'p',text:`${K.ad||'[mükellef]'} hakkında aşağıdaki tabloda yer alan görevlendirme yazıları ile ${donem} ${term} için ${vt}yönünden ${trL(M.kapsam||'tam')} inceleme yapılması istenilmiştir.`});
    blocks.push({id:uid(),type:'table',head:true,rows:[['Görevlendiren Birim','Yazı Tarihi','Yazı Sayısı','İnceleme Konusu'],...gv.map(g=>[(g.birim||M.daire||'')+' Daire Başkanlığı',fmtDate(g.tarih),g.sayi,g.konu||M.konu||''])]});
  }
  if(M.konu)blocks.push({id:uid(),type:'p',text:`İncelemenin konusu ${lowerFirst(M.konu).replace(/\.$/,'')} olup inceleme ${trL(M.kapsam||'tam')} inceleme olarak yürütülmüştür.`});
  blocks.push({id:uid(),type:'p',text:`${mt}, ${K.vkn||'[vergi kimlik no]'} vergi kimlik numarası ile ${K.vd||'[vergi dairesi]'} Vergi Dairesi Müdürlüğünün mükellefi olup ${K.adres?K.adres+' adresinde ':''}${K.is?trL(K.is[0])+K.is.slice(1)+' faaliyetinde bulunmaktadır.':'faaliyette bulunmaktadır.'}${K.faaliyet&&K.faaliyet!=='Faal'?` ${mt} halen ${trL(K.faaliyet)} durumdadır.`:` ${mt} faaliyetine devam etmektedir.`}`});
  if(isKurum(R)&&M.ortaklar.some(o=>o.ad)){
    blocks.push({id:uid(),type:'p',text:`${mukellefIn(R)} inceleme dönemi itibarıyla ortakları ve hisse oranları aşağıdaki tabloda gösterilmiştir.`});
    blocks.push({id:uid(),type:'table',head:true,rows:[['Ortağın Adı Soyadı / Unvanı','Vergi / T.C. Kimlik No','Hisse Oranı (%)'],...M.ortaklar.filter(o=>o.ad).slice(0,5).map(o=>[o.ad,o.vkn,o.oran])]});
  }
  return blocks;
}
function sonucTaslak(R){
  const M=R.meta,K=M.mukellef,mt=mukellefTerim(R),blocks=[],term=donemTerimi(R),vt=M.vergiTuru?trL(M.vergiTuru):'[vergi türü]';
  blocks.push({id:uid(),type:'p',text:`${K.ad||'[mükellef]'} (${K.vkn||'[VKN]'}) hakkında ${M.donem||'[dönem]'} ${term} için ${vt} yönünden yapılan ${trL(M.kapsam||'tam')} vergi incelemesi sonucunda, raporun ilgili bölümlerinde açıklandığı üzere;`});
  const items=[];
  for(const d of R.veriler){
    const v=k=>{const n=parseNum(d[k]);return isNaN(n)||n===0?null:fmtTL(n)+' TL';};
    const parts=[];
    if(v('matrahFarki'))parts.push(`${v('matrahFarki')} matrah farkı`);
    if(v('tarhi'))parts.push(`${v('tarhi')} ${vt} tarhı`);
    else if(v('vergiFarki'))parts.push(`${v('vergiFarki')} vergi farkı`);
    if(v('vzc1'))parts.push(`${v('vzc1')} vergi ziyaı cezası (1 kat) [yasal dayanak]`);
    if(v('vzc3'))parts.push(`${v('vzc3')} vergi ziyaı cezası (3 kat) [yasal dayanak]`);
    if(v('usulsuz'))parts.push(`${v('usulsuz')} usulsüzlük cezası [yasal dayanak]`);
    if(v('ozelUsulsuz'))parts.push(`${v('ozelUsulsuz')} özel usulsüzlük cezası [yasal dayanak]`);
    if(v('iadeEdilecek'))parts.push(`${v('iadeEdilecek')} iade`);
    if(v('iadeRed'))parts.push(`${v('iadeRed')} iade talebinin reddi`);
    if(parts.length)items.push(`${d.donem||'[dönem]'} döneminde ${parts.join(', ')}`);
  }
  if(items.length)blocks.push({id:uid(),type:'list',text:items.map((s,i)=>s+(i<items.length-1?' gerektiği,':' gerektiği sonuç ve kanaatine varılmıştır.')).join('\n')});
  else if(VIR_LIKE.has(R.type))blocks.push({id:uid(),type:'p',text:'[İnceleme verileri girilmemiş: dönemler itibarıyla matrah farkı, vergi ve cezaları yazınız.]'});
  if(VIR_LIKE.has(R.type)){
    const mi=mukellefIn(R);const uz={Var:`${mi} tarhiyat öncesi uzlaşma talebi bulunmaktadır.`,Yok:`${mi} tarhiyat öncesi uzlaşma talebi bulunmamaktadır.`,'Kapsam dışı':'İnceleme sonucu tarhiyat öncesi uzlaşma kapsamı dışındadır.'}[M.uzlasma]||'';
    if(uz)blocks.push({id:uid(),type:'p',text:uz});
    blocks.push({id:uid(),type:'p',text:M.rdk==='Var'?`${mi} Rapor Değerlendirme Komisyonunda dinlenme talebi bulunmaktadır.`:`${mi} Rapor Değerlendirme Komisyonunda dinlenme talebi bulunmamaktadır.`});
  }
  return blocks;
}

/* ---------------- Kontrol: Rehber şekil/yazım kuralları, Yönetmelik hükümleri, tutarlılık, yazım ---------------- */
// Her bulgu: {lvl:'err'|'warn'|'info', msg, src, where:{tab, path?, sec?, block?}, fix?:{block,from,to}}
const ABBR=['VUK','GVK','KVK','KDVK','ÖTVK','DVK','AATUHK','TTK','TCK','KDV','ÖTV','BSMV','VTR','VİR','VSR','GÖR','RDK','YMM','SMMM','GİB','VDK','MBR','SGK','HMB'];
// Sık yapılan yazım yanlışları (TDK İmla Kılavuzu) – [desen, doğrusu]
const TRL_='A-Za-zÇĞİÖŞÜçğıöşüÂÎÛâîû';
const SW=(src,pre)=>new RegExp(`(?<![${TRL_}])(?:${src})${pre?'':`(?![${TRL_}])`}`,'gi');
const SPELL=[
  [SW('itibari ?(?:ile|yle)|itibariyle'),'itibarıyla'],[SW('tesbit',1),'tespit'],[SW('bir çok'),'birçok'],[SW('hiç bir'),'hiçbir'],
  [SW('herşey',1),'her şey'],[SW('birşey',1),'bir şey'],[SW('yada'),'ya da'],[SW('herhangibir'),'herhangi bir'],[SW('pekçok'),'pek çok'],[SW('bir takım'),'birtakım'],
  [SW('hergün'),'her gün'],[SW('heryıl'),'her yıl'],[SW('birkez'),'bir kez'],[SW('malesef'),'maalesef'],[SW('yanlız'),'yalnız'],[SW('yalnış',1),'yanlış'],
  [SW('orjinal',1),'orijinal'],[SW('mütabakat',1),'mutabakat'],[SW('başka bir değişle'),'başka bir deyişle'],[SW('bir başka değişle'),'bir başka deyişle'],
  [SW('bu güne kadar'),'bugüne kadar'],[SW('farket',1),'fark et'],[SW('açıkca'),'açıkça'],[SW('şuan'),'şu an'],
];
const keepCase=(m,to)=>m[0]===trU(m[0])&&m[0]!==trL(m[0])&&to[0]===trL(to[0])?trU(to[0])+to.slice(1):to;
function sectionsFlat(R){const out=[];walk(R.sections,(s,num,depth)=>out.push({s,num,depth}));return out;}
const secByTitle=(R,re)=>sectionsFlat(R).filter(x=>re.test(trL(x.s.title)));
const secText=s=>{const t=[];const rec=x=>{for(const b of x.blocks)t.push(b.type==='table'?b.rows.flat().join(' '):(b.text||''));x.children.forEach(rec);};rec(s);return t.join('\n');};
const dateOf=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;};
const addMonths=(d,n)=>{const x=new Date(d);x.setMonth(x.getMonth()+n);return x;};
const dayDiff=(a,b)=>Math.round((b-a)/86400000);
const fmtD=d=>d?`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`:'';

function checkReport(R){
  const W=[],M=R.meta,K=M.mukellef;
  const add=(lvl,msg,src,where,fix)=>W.push({lvl,msg,src,where:where||{tab:'bilgi'},fix});
  const F=path=>({tab:'bilgi',path});
  const vir=VIR_LIKE.has(R.type),tarhiyat=R.type==='vir',gor=/^gor/.test(R.type);

  /* ---- 1. Kapak (Rehber 2.1.2) ---- */
  for(const[k,l]of[['daire','Daire Başkanlığı'],['tarih','Rapor tarihi'],['sayi','Rapor sayısı'],['konu','İnceleme konusu'],['donem','İnceleme dönemi'],['vergiTuru','Vergi türü']])
    if(!M[k]&&!(gor&&k==='vergiTuru'))add('warn',`"${l}" boş.`,'Rehber – kapak',F('meta.'+k));
  M.mufettisler.forEach((m,i)=>{if(!m.ad)add('warn','Raporu düzenleyen Vergi Müfettişinin adı soyadı girilmemiş.','Rehber – kapak',F(`meta.mufettisler.${i}.ad`));});
  M.gorevler.forEach((g,i)=>{if(!g.tarih)add('warn','Görevlendirme yazısının tarihi girilmemiş.','Rehber – kapak',F(`meta.gorevler.${i}.tarih`));if(!g.sayi)add('warn','Görevlendirme yazısının sayısı girilmemiş.','Rehber – kapak',F(`meta.gorevler.${i}.sayi`));});
  if(!gor)for(const[k,l]of[['ad','Mükellefin adı/unvanı'],['vkn','Vergi/T.C. kimlik numarası'],['vd','Vergi dairesi (tarha yetkili)'],['adres','Adresi'],['is','İşi'],['meslekKodu','Meslek kodu'],['tel','Telefonu']])
    if(!K[k])add(k==='meslekKodu'||k==='tel'?'info':'warn',`Mükellefin "${l}" bilgisi boş.`,'Rehber – kapak',F('meta.mukellef.'+k));
  if(K.vkn&&!/^\d{10,11}$/.test(String(K.vkn).replace(/\s/g,'')))add('err','Vergi kimlik numarası 10, T.C. kimlik numarası 11 haneli olmalı.','Kapak',F('meta.mukellef.vkn'));
  if(K.vd&&/vergi dairesi/i.test(K.vd))add('info','Vergi dairesi alanına yalnızca adını yazın ("Kozyatağı"); "Vergi Dairesi Müdürlüğü" ifadesi otomatik eklenir.','Kapak',F('meta.mukellef.vd'));
  if(M.daire&&/daire başkanlığı/i.test(M.daire))add('info','Daire alanına yalnızca birimin adını yazın; "Daire Başkanlığı" ifadesi otomatik eklenir.','Kapak',F('meta.daire'));
  M.mufettisler.forEach((m,i)=>{if(/(?<![A-Za-zÇĞİÖŞÜçğıöşü])(yrd|yard)\./i.test(m.ad+' '+m.unvan))add('err','Unvan kısaltılmamalı: "Vergi Müfettiş Yardımcısı" yazılmalı.','Rehber 2.1.3.1',F(`meta.mufettisler.${i}.unvan`));});

  /* ---- 2. Yönetmelik: süreler (md. 9, 12, 23) ---- */
  const gorevT=M.gorevler.map(g=>dateOf(g.tarih)).filter(Boolean).sort((a,b)=>a-b)[0];
  const bas=dateOf(M.baslama),rap=dateOf(M.tarih);
  if(vir&&!M.baslama)add('info','İncelemeye başlama tarihini (başlama tutanağının imzalandığı tarih) girerseniz inceleme süresi kontrol edilir.','Yönetmelik md. 9, 23',F('meta.baslama'));
  if(gorevT&&bas){const d=dayDiff(gorevT,bas);
    if(d<0)add('err',`İncelemeye başlama tarihi (${fmtD(bas)}) görevlendirme tarihinden (${fmtD(gorevT)}) önce olamaz.`,'Yönetmelik md. 9',F('meta.baslama'));
    else if(d>45)add('err',`İncelemeye görevden ${d} gün sonra başlanmış: en geç 30 gün (mazerete bağlı en fazla 15 gün ek süreyle 45 gün) içinde başlanmalı.`,'Yönetmelik md. 9/1',F('meta.baslama'));
    else if(d>30)add('warn',`İncelemeye görevden ${d} gün sonra başlanmış: 30 günlük süre aşılmış; mazerete bağlı ek süre (en fazla 15 gün) alındığından emin olun.`,'Yönetmelik md. 9/1',F('meta.baslama'));}
  if(bas){
    const iade=R.type==='virIade'&&/katma/i.test(M.vergiTuru||'');
    const lim=iade?3:(M.kapsam==='Sınırlı'?6:12),ekMax=iade?2:6,ek=Number(M.ekSure||0);
    if(ek>ekMax)add('err',`Ek süre en fazla ${ekMax} ay olabilir (girilen: ${ek} ay).`,'Yönetmelik md. 23/3',F('meta.ekSure'));
    const son=addMonths(bas,lim+Math.min(ek,ekMax)),bitis=rap||new Date();
    const ad=iade?'KDV iade incelemesi':(M.kapsam==='Sınırlı'?'sınırlı inceleme':'tam inceleme');
    if(bitis>son)add('err',`İnceleme süresi aşılmış: ${ad} için süre ${lim} ay${ek?` + ${ek} ay ek süre`:''}; son gün ${fmtD(son)}, rapor tarihi ${fmtD(bitis)}.`+(ek<ekMax?' Ek süre aldıysanız "Ek süre" alanına girin.':' Süre aşımı gerekçesiyle yazılı olarak bildirilmeli.'),'Yönetmelik md. 23',F(rap?'meta.tarih':'meta.baslama'));
    else if(!ek){const ilk=addMonths(bas,lim),kalan=dayDiff(rap||new Date(),ilk);if(!rap&&kalan<=10&&kalan>=0)add('warn',`Süre bitimine ${kalan} gün kaldı (${fmtD(ilk)}). Ek süre, bitimden en geç 10 gün önce gerekçeli yazıyla istenmeli.`,'Yönetmelik md. 23/2',F('meta.ekSure'));}
  }
  if(M.ibrazGun!==''&&M.ibrazGun!=null&&Number(M.ibrazGun)<15)add('err',`Defter ve belge isteme yazısında verilen ibraz süresi (${M.ibrazGun} gün) en az 15 gün olmalı.`,'Yönetmelik md. 12/1',F('meta.ibrazGun'));

  /* ---- 3. Yönetmelik md. 19: rapor yapısı ---- */
  const yrs=(String(M.donem||'').match(/(?:19|20)\d{2}/g)||[]).filter((v,i,a)=>a.indexOf(v)===i);
  if(yrs.length>1){
    if(/^(Gelir Vergisi|Kurumlar Vergisi)$/.test(M.vergiTuru))add('err',`Raporlar vergi türü ve dönemi itibarıyla ayrı düzenlenir: ${yrs.join(', ')} için ayrı rapor yazılmalı.`,'Yönetmelik md. 19/1',F('meta.donem'));
    else add('warn',`Vergilendirme dönemi bir yıldan kısa vergilerde tek rapor takvim yılını (özel hesap döneminde hesap dönemini) aşmamalı: ${yrs.join(', ')}.`,'Yönetmelik md. 19/1',F('meta.donem'));
  }
  if(/[,/]| ve /i.test(M.vergiTuru||''))add('err','Birden fazla vergi türü için ayrı ayrı rapor düzenlenir.','Yönetmelik md. 19/2',F('meta.vergiTuru'));
  if(tarhiyat){
    const need=[[/^giriş$/,'Giriş'],[/^usul incelemeleri$/,'Usul İncelemeleri'],[/^hesap incelemeleri$/,'Hesap İncelemeleri'],[/^eleştirilen hususlar/,'Eleştirilen Hususlar'],[/^sonuç$/,'Sonuç']];
    for(const[re,l]of need)if(!R.sections.some(s=>re.test(trL(s.title))))add('err',`Tarhiyat/ceza önerisi içeren raporda "${l}" bölümü bulunmalı.`,'Yönetmelik md. 19/4',{tab:'bolum'});
    const el=secByTitle(R,/^eleştirilen hususlar/)[0];
    if(el&&secText(el.s).length>200&&!/ifade|beyan|savunma|itiraz|ileri sür|açıklama|mülahaza/i.test(secText(el.s)))
      add('warn','Mükellefin inceleme sırasında ileri sürdüğü hususlar ve bunların değerlendirmesi "Eleştirilen Hususlar" bölümünde yer almalı.','Yönetmelik md. 19/4',{tab:'bolum',sec:el.s.id});
  }
  if(R.type==='virKabul')add('info','Eleştiri gerektiren husus bulunmadığından bu durum mükellefe yazıyla bildirilmeli.','Yönetmelik md. 19/5',{tab:'bolum'});
  if(M.ozelge==='Var'){const all=sectionsFlat(R).map(x=>secText(x.s)).join('\n');if(!/özelge/i.test(all))add('err','Mükellef özelge ibraz etmiş: özelge raporda değerlendirilmeli.','Yönetmelik md. 18/2',{tab:'bolum'});}

  /* ---- 4. Sonuç tutarlılığı ---- */
  const son=sectionsFlat(R).find(x=>/^sonuç$/.test(trL(x.s.title)));
  if(son&&vir){
    const t=secText(son.s);
    if(!/uzlaşma/i.test(t))add('warn','Sonuç bölümünde mükellefin tarhiyat öncesi uzlaşma talebine yer verilmeli.','Rehber – sonuç',{tab:'bolum',sec:son.s.id});
    if(!/dinlenme/i.test(t))add('warn','Sonuç bölümünde Rapor Değerlendirme Komisyonunda dinlenme talebine yer verilmeli.','Rehber – sonuç',{tab:'bolum',sec:son.s.id});
    if(M.uzlasma==='Var'&&/uzlaşma talebi bulunmamaktadır/i.test(t))add('err','Kapakta uzlaşma talebi "Var" ama Sonuç bölümünde "bulunmamaktadır" yazıyor.','Tutarlılık',{tab:'bolum',sec:son.s.id});
    if(M.uzlasma==='Yok'&&/uzlaşma talebi bulunmaktadır/i.test(t))add('err','Kapakta uzlaşma talebi "Yok" ama Sonuç bölümünde "bulunmaktadır" yazıyor.','Tutarlılık',{tab:'bolum',sec:son.s.id});
    if(M.rdk==='Var'&&/dinlenme talebi bulunmamaktadır/i.test(t))add('err','Dinlenme talebi "Var" seçili ama Sonuç bölümünde "bulunmamaktadır" yazıyor.','Tutarlılık',{tab:'bolum',sec:son.s.id});
    if(M.rdk==='Yok'&&/dinlenme talebi bulunmaktadır/i.test(t))add('err','Dinlenme talebi "Yok" seçili ama Sonuç bölümünde "bulunmaktadır" yazıyor.','Tutarlılık',{tab:'bolum',sec:son.s.id});
    const amounts=new Set((t.match(/\d{1,3}(?:\.\d{3})*,\d{2}/g)||[]));
    for(const d of R.veriler)for(const[k,l]of VERI_SATIRLARI){if(k==='beyan'||k==='iadeTalep')continue;const n=parseNum(d[k]);if(isNaN(n)||!n)continue;const f=fmtTL(n);
      if(!amounts.has(f))add('warn',`İnceleme verilerindeki ${d.donem||''} dönemi "${l}" (${f} TL) Sonuç bölümünde geçmiyor. Önerilen vergi ve ceza tutarları sonuçta açıkça gösterilmeli.`,'Yönetmelik md. 19/4',{tab:'bolum',sec:son.s.id});}
  }

  /* ---- 5. Metin: Rehber yazım kuralları + imla ---- */
  const full=[];const once=new Set();let seen='';
  const term0=donemTerimi(R);
  const firstOnly=(key,lvl,msg,src,where)=>{if(once.has(key))return;once.add(key);add(lvl,msg,src,where);};
  walk(R.sections,(s,num)=>{
    const empty=!s.blocks.some(b=>(b.text&&b.text.trim())||(b.rows&&b.rows.flat().some(c=>String(c).trim())));
    if(empty&&!s.children.length)add('warn',`${numStr(num)} ${s.title}: bölüm boş.`,'Rehber',{tab:'bolum',sec:s.id});
    if(/özel usulsüzlük/i.test(trL(s.title))&&empty)add('warn','"Özel Usulsüzlük" alt başlığı yalnızca bu ceza gerekiyorsa açılır; boşsa kaldırın.','Rehber – usul',{tab:'bolum',sec:s.id});
    if(/^usul incelemeleri$/.test(trL(s.title))&&empty)add('warn','Usul yönünden eleştiri yoksa "Usul yönünden eleştirilecek bir husus tespit edilmemiştir." yazılmalı.','Rehber – usul',{tab:'bolum',sec:s.id});
    if(s.title&&s.title.length>110)add('info','Başlık çok uzun; kısaltmayı düşünün.','Rehber',{tab:'bolum',sec:s.id});
    for(const b of s.blocks){
      const where={tab:'bolum',sec:s.id,block:b.id};
      if(b.type==='table'){
        const rows=b.rows.filter(r=>r.some(c=>String(c).trim()));full.push(rows.flat().join(' '));
        if(rows.length>45)add('warn',`Tablo ${rows.length} satır: matrah farkını gösteren temel tablolar dışındaki uzun tablolar rapora ek yapılmalı.`,'Rehber 2.1.3.1',where);
        if(rows.length&&rows.some(r=>r.length!==rows[0].length))add('info','Tablonun bazı satırlarında hücre sayısı farklı.','Tablo',where);
        continue;
      }
      const text=b.text||'';full.push(text);
      for(const line of linesOf(text)){
        if(isKurum(R)&&/(?<![A-Za-zÇĞİÖŞÜçğıöşü])Mükellef(?!\s+Kurum)(?![a-zçğıöşü])/.test(line))firstOnly('mk','warn','Kurumlar vergisi mükellefi için "Mükellef" yerine "Mükellef Kurum" ibaresi kullanılmalı.','Rehber 2.1.3.1',where);
        if(/^Gelir Vergisi$/.test(M.vergiTuru)&&/Mükellef Kurum/.test(line))firstOnly('mg','warn','Gelir vergisi mükellefi için "Mükellef" ibaresi kullanılmalı.','Rehber 2.1.3.1',where);
        if(term0==='takvim yılı'&&/hesap dönemi/i.test(line))firstOnly('ty','warn','Gelir vergisinde inceleme yılı "takvim yılı" olarak belirtilmeli ("hesap dönemi" kullanılmış).','Rehber 2.1.3.1',where);
        if(term0==='hesap dönemi'&&/takvim yılı/i.test(line))firstOnly('hd','warn','Kurumlar vergisinde inceleme yılı "hesap dönemi" olarak belirtilmeli ("takvim yılı" kullanılmış).','Rehber 2.1.3.1',where);
        for(const a of ABBR){if(once.has('ab'+a))continue;const re=new RegExp(`(^|[^A-Za-zÇĞİÖŞÜçğıöşü])${a}(?![A-Za-zÇĞİÖŞÜ])`);const m=re.exec(line);if(!m)continue;once.add('ab'+a);
          if(!(seen+line.slice(0,m.index+a.length+3)).includes('('+a+')'))add('info',`"${a}" kısaltması ilk geçtiği yerde açık yazımından sonra parantez içinde verilmeli (örn. Vergi Usul Kanunu (VUK)).`,'Rehber 2.1.3.1',where);}
        seen+=line+'\n';
        if(/\bYrd\.|\bYard\./.test(line))add('err','"Yrd./Yard." yazılmaz; "Vergi Müfettiş Yardımcısı" yazılmalı.','Rehber 2.1.3.1',where,{block:b.id,from:/Vergi Müfettiş(i)? (Yrd\.|Yard\.)|Yrd\.|Yard\./,to:'Vergi Müfettiş Yardımcısı'});
        for(const sent of line.split(/(?<=[.!?])\s+/)){const L=sent.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g,'');if(L.length>25&&L===trU(L))add('warn','Vurgu amacıyla cümlenin tamamı büyük harfle yazılmaz: “'+sent.slice(0,50)+'…”','Rehber 2.1.3.1',where);}
        if(/gibintranet|vdkbis-?mbr['’]?den tespit/i.test(line))add('warn','"Gibintranet / VDKBİS-MBR\'den tespit edilmiştir" yerine tespitin dayanağı yazılmalı.','Rehber 2.1.3.1',where);
        const ph=line.match(/\[[^\]]{2,60}\]/);if(ph)add('err','Doldurulmamış yer tutucu: '+ph[0],'Taslak',where);
        if(/dipnot|\bbkz\.? dipnot/i.test(line))add('info','Rapor eklerine yapılan atıflarda dipnot kullanılmaz; atıf cümle sonunda parantez içinde yapılır: (Ek: 1 Tutanak Md. 12).','Rehber 2.1.3.1',where);
        if(/\(\s*ek\s*[-:]?\s*\d+[^)]*\)/i.test(line)&&!/\(Ek: \d+( Tutanak)?( Madde| Md\.)? ?\d*\)/.test(line))add('info','Tutanak atfı biçimi: (Ek: 1 Tutanak Md. 12).','Rehber 2.1.3.1',where);
        for(const[re,to]of SPELL){re.lastIndex=0;const m=re.exec(line);if(m){const t2=keepCase(m[0],to);if(m[0]!==t2)add('warn',`Yazım: "${m[0]}" yerine "${t2}" yazılmalı.`,'TDK İmla Kılavuzu',where,{block:b.id,from:m[0],to:t2});}}
        if(/ {2,}/.test(line))add('info','Kelimeler arasında birden fazla boşluk var.','Yazım',where,{block:b.id,from:/ {2,}/g,to:' '});
        const sp=line.match(/ +[,.;:](?!\d)/);if(sp)add('info','Noktalama işaretinden önce boşluk bırakılmaz.','Yazım',where,{block:b.id,from:/ +([,.;:])(?!\d)/g,to:'$1'});
        if(/[,;](?=[A-Za-zÇĞİÖŞÜçğıöşü])/.test(line))add('info','Virgül/noktalı virgülden sonra boşluk bırakılmalı.','Yazım',where,{block:b.id,from:/([,;])(?=[A-Za-zÇĞİÖŞÜçğıöşü])/g,to:'$1 '});
        const q=(line.match(/[“”"]/g)||[]).length;if(q%2)add('warn','Tırnak işareti kapatılmamış.','Yazım',where);
        if((line.match(/\(/g)||[]).length!==(line.match(/\)/g)||[]).length)add('warn','Parantez sayısı eşit değil (açılan/kapanan).','Yazım',where);
        if(b.type==='p'&&/^[a-zçğıöşü]/.test(line))add('info','Paragraf küçük harfle başlıyor.','Yazım',where);
        if(b.type==='p'&&line.length>40&&!/[.:;!?)”"]$/.test(line))add('info','Paragraf noktalama işaretiyle bitmiyor.','Yazım',where);
        const am=line.match(/\b\d{4,}(?:,\d{1,2})? ?(?:TL|₺)/);if(am)add('info',`Tutar biçimi: "${am[0]}" → binlik ayraçlı yazın (örn. 1.250.000,00 TL).`,'Yazım',where);
        if(/\d\.-\s?TL/.test(line))add('info','"1.000.-TL" yerine "1.000,00 TL" biçimi kullanılmalı.','Yazım',where);
      }
    }

}
function blockHtml(b,i,n){
  const ctl=`<button class="btn small" data-bop="up|${b.id}" ${i===0?'disabled':''}>↑</button><button class="btn small" data-bop="down|${b.id}" ${i===n-1?'disabled':''}>↓</button><button class="btn small danger" data-bop="del|${b.id}">✕</button>`;
  if(b.type==='table'){
    const rows=b.rows,nc=Math.max(1,...rows.map(r=>r.length));
    return `<div class="blk" data-block="${b.id}"><div class="blk-h"><span class="tag">Tablo</span>${ctl}</div>
      <label class="f"><span>Tablo başlığı (isteğe bağlı)</span><input type="text" data-tcap="${b.id}" value="${hesc(b.caption||'')}" placeholder="Tablo 1: …"></label>
      <div class="tbl-ed" style="margin-top:8px"><table>${rows.map((r,ri)=>`<tr>${Array.from({length:nc},(_,ci)=>`<td><input type="text" class="${ri===0&&b.head!==false?'h':''}" data-cell="${b.id}|${ri}|${ci}" value="${hesc(r[ci]==null?'':r[ci])}"></td>`).join('')}</tr>`).join('')}</table></div>
      <div class="addbar"><button class="btn small" data-top="addr|${b.id}">+ Satır</button><button class="btn small" data-top="addc|${b.id}">+ Sütun</button><button class="btn small" data-top="delr|${b.id}">− Son satır</button><button class="btn small" data-top="delc|${b.id}">− Son sütun</button><button class="btn small" data-top="paste|${b.id}">Excel'den yapıştır</button>
      <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-thead="${b.id}" ${b.head!==false?'checked':''}> İlk satır başlık</label><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-ttot="${b.id}" ${b.total?'checked':''}> Son satır toplam (kalın)</label></div>
      <p class="muted">Tablo Word'de ortalanır; tutarlar sağa, yazılar sola yaslanır. Excel'de seçip kopyaladığınız hücreleri herhangi bir hücreye yapıştırabilirsiniz.</p></div>`;
  }
  const tools=b.type==='list'?'':`<button class="btn small" data-ins="ref|${b.id}">+ Tutanak atfı</button>${b.type==='p'?`<button class="btn small" data-ins="b|${b.id}"><b>K</b></button><button class="btn small" data-ins="i|${b.id}"><i>İ</i></button><button class="btn small" data-ins="q|${b.id}">“ ”</button>`:''}`;
  const note={p:'Her satır ayrı paragraf olur. Tırnak içindeki ifadeler otomatik italik yazılır. **kalın**, *italik*.',quote:'Mükellef ifadeleri ve alıntılar tırnak içinde ve italik yazılır; tırnağı siz eklemeseniz de eklenir.',list:'Her satır bir madde olur.'}[b.type];
  return `<div class="blk" data-block="${b.id}"><div class="blk-h"><span class="tag">${BLK_LABEL[b.type]}</span>${tools}${ctl}</div><textarea data-btext="${b.id}" rows="${Math.min(14,Math.max(3,Math.ceil((b.text||'').length/80)+((b.text||'').match(/\n/g)||[]).length))}">${hesc(b.text||'')}</textarea><div class="muted" style="margin-top:4px">${note}</div></div>`;
}
function renderEkler(){
  let h=`<div class="card"><h2>Ekler (ek dizini)</h2><p class="muted">Raporun sonuna "Ek No – Ek Adı – Sayfa Adedi" sütunlu ek dizini eklenir; sonunda toplam sayfa ve CD/DVD adedi gösterilir. Ek dizini sayfaları numaralandırılmaz.</p><div class="list">${R.ekler.map((e,i)=>`<div class="item"><div class="row"><div style="font-weight:700;padding-bottom:10px">Ek ${i+1}</div>${fText(`ekler.${i}.ad`,'Ek adı','Vergi İnceleme Tutanağı')}<label class="f" style="max-width:130px"><span>Sayfa adedi</span><input type="number" min="0" inputmode="numeric" data-bind="ekler.${i}.sayfa" value="${hesc(e.sayfa||'')}"></label><div class="row" style="flex:none"><button class="btn small" data-mv="ekler|${i}|-1">↑</button><button class="btn small" data-mv="ekler|${i}|1">↓</button><button class="btn small danger" data-rm="ekler|${i}">✕</button></div></div></div>`).join('')}</div>
  <button class="btn small" data-add="ek">+ Ek ekle</button><div class="grid" style="margin-top:14px"><label class="f"><span>CD/DVD adedi</span><input type="number" min="0" data-bind="cd" value="${hesc(R.cd||'')}"></label></div></div>`;
  $('main').innerHTML=h;
}
function renderKontrol(){
  const e=ISS.filter(i=>i.lvl==='err'),w=ISS.filter(i=>i.lvl==='warn'),n=ISS.filter(i=>i.lvl==='info');
  const fixable=ISS.filter(i=>i.fix).length;
  let h=`<div class="card"><h2>Kontrol</h2><div class="summary">${e.length?`<span class="pill err">${e.length} hata</span>`:''}${w.length?`<span class="pill warn">${w.length} uyarı</span>`:''}${n.length?`<span class="pill info">${n.length} öneri</span>`:''}${!ISS.length?'<span class="pill ok">Sorun bulunamadı</span>':''}${fixable?`<button class="btn small" id="fixAll">Yazım hatalarının hepsini düzelt (${fixable})</button>`:''}</div>
  <p class="muted">Kaynaklar: Raporlama Rehberi şekil ve yazım kuralları; Vergi İncelemelerinde Uyulacak Usul ve Esaslar Hakkında Yönetmelik; TDK İmla Kılavuzu; kapak bilgileri ile metin arasındaki tutarlılık. "Git" uyarının olduğu yere götürür.</p>`;
  h+=ISS.map((i,k)=>`<div class="chk ${i.lvl}"><span class="ic">${i.lvl==='err'?'!':i.lvl==='warn'?'▲':'i'}</span><div><div>${hesc(i.msg)}</div><div class="src">${hesc(i.src)}</div></div><div class="acts">${i.fix?`<button class="btn small" data-fix="${k}">Düzelt</button>`:''}<button class="btn small" data-go="${k}">Git</button></div></div>`).join('');
  $('main').innerHTML=h+'</div>';
}
function renderOnizleme(){$('main').innerHTML=`<div class="card"><h2>Önizleme</h2><p class="muted">Word çıktısının yaklaşık görünümü. Sayfa numaraları Word'de alt ortada "1/25" biçiminde yer alır; kapak ve ek dizini numaralandırılmaz.</p><div class="pv">${previewHtml(R)}</div></div>`;}

/* ---------- işlemler ---------- */
function blocksOf(id){let r=null;walk(R.sections,s=>{if(s.blocks.some(b=>b.id===id))r=s;});return r;}
function parentList(id){let res=null;const rec=(arr,parent)=>{arr.forEach((s,i)=>{if(s.id===id)res={arr,i,parent};rec(s.children,s);});};rec(R.sections,null);return res;}
function secOp(op){
  const P=parentList(SEC);if(!P&&op!=='new')return;
  if(op==='new'){const s=mkSection({title:'Yeni Bölüm'});R.sections.push(s);SEC=s.id;}
  else if(op==='child'){const s=mkSection({title:'Yeni Alt Başlık'});P.arr[P.i].children.push(s);SEC=s.id;}
  else if(op==='sibling'){const s=mkSection({title:'Yeni Bölüm'});P.arr.splice(P.i+1,0,s);SEC=s.id;}
  else if(op==='up'&&P.i>0){[P.arr[P.i-1],P.arr[P.i]]=[P.arr[P.i],P.arr[P.i-1]];}
  else if(op==='down'&&P.i<P.arr.length-1){[P.arr[P.i+1],P.arr[P.i]]=[P.arr[P.i],P.arr[P.i+1]];}
  else if(op==='in'&&P.i>0){const s=P.arr.splice(P.i,1)[0];P.arr[P.i-1].children.push(s);}
  else if(op==='out'&&P.parent){const s=P.arr.splice(P.i,1)[0];const G=parentList(P.parent.id);G.arr.splice(G.i+1,0,s);}
  else if(op==='del'){const s=P.arr[P.i];if(!confirm(`"${s.title}" bölümü ve alt başlıkları silinsin mi?`))return;P.arr.splice(P.i,1);SEC=(P.arr[P.i]||P.arr[P.i-1]||P.parent||R.sections[0]||{}).id;}
  changed();render();runCheck();
}
function insertAt(ta,before,after,ph){const s=ta.selectionStart,e=ta.selectionEnd,sel=ta.value.slice(s,e)||ph||'';ta.value=ta.value.slice(0,s)+before+sel+after+ta.value.slice(e);ta.focus();ta.selectionStart=s+before.length;ta.selectionEnd=s+before.length+sel.length;ta.dispatchEvent(new Event('input',{bubbles:true}));}
function fillTable(b,r0,c0,text){
  const lines=text.replace(/\r/g,'').replace(/\n$/,'').split('\n').map(l=>l.split('\t'));
  for(let i=0;i<lines.length;i++){const r=r0+i;while(b.rows.length<=r)b.rows.push([]);for(let j=0;j<lines[i].length;j++){const c=c0+j;while(b.rows[r].length<=c)b.rows[r].push('');b.rows[r][c]=lines[i][j].trim();}}
  const nc=Math.max(...b.rows.map(r=>r.length));b.rows.forEach(r=>{while(r.length<nc)r.push('');});
}
function safeName(s){return String(s||'').replace(/[çÇ]/g,'c').replace(/[ğĞ]/g,'g').replace(/[ıİ]/g,'i').replace(/[öÖ]/g,'o').replace(/[şŞ]/g,'s').replace(/[üÜ]/g,'u').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40);}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}
const SHORT={vir:'VIR',virKabul:'VIR_Kabul',virIade:'VIR_Iade',vtr:'VTR',vtrTam:'VTR',vtrKismen:'VTR',vtrTaklit:'VTR',vtrMuht:'VTR',vsr:'VSR'};
async function wordIndir(){
  try{
    const b=await buildDocx(R);const nm=[SHORT[R.type]||'GOR',safeName(R.meta.donem),safeName(R.meta.mukellef.ad)].filter(Boolean).join('_')+'.docx';
    download(b,nm);const e=ISS.filter(i=>i.lvl==='err').length;toast(e?`Word indirildi. Kontrol listesinde ${e} hata var.`:'Word dosyası indirildi.');
  }catch(err){toast('Word oluşturulamadı: '+(err&&err.message||err));}
}
/* ---------- olay bağlama ---------- */
function bind(){
  $('tabs').onclick=e=>{const b=e.target.closest('button[data-tab]');if(!b)return;TAB=b.dataset.tab;render();};
  const main=$('main');
  main.addEventListener('input',e=>{
    const t=e.target;
    if(t.dataset.bind){setP(t.dataset.bind,t.type==='checkbox'?t.checked:t.value);changed();return;}
    if(t.dataset.btext){const b=findBlock(R,t.dataset.btext);b.text=t.value;changed();return;}
    if(t.dataset.cell){const[id,r,c]=t.dataset.cell.split('|');const b=findBlock(R,id);b.rows[+r][+c]=t.value;changed();return;}
    if(t.dataset.tcap){findBlock(R,t.dataset.tcap).caption=t.value;changed();return;}
    if(t.id==='secTitle'){const S=findSection(R,SEC);S.title=t.value;let d=1,n=[];walk(R.sections,(s,nn,dd)=>{if(s.id===SEC){d=dd;n=nn;}});$('secPrev').textContent=numStr(n)+' '+headingCase(S.title,d);const tb=document.querySelector(`#tree [data-sid="${SEC}"] span:nth-child(2)`);if(tb)tb.textContent=S.title||'(başlıksız)';changed();}
  });
  main.addEventListener('change',e=>{
    const t=e.target;
    if(t.dataset.bind){setP(t.dataset.bind,t.type==='checkbox'?t.checked:t.value);changed();if(/^meta\.(vergiTuru)$|^meta\.gorevler|^ayar\./.test(t.dataset.bind)&&TAB==='bilgi')render();
      if(t.classList.contains('num')){const n=parseNum(t.value);if(!isNaN(n)){t.value=fmtTL(n);setP(t.dataset.bind,t.value);}}return;}
    if(t.id==='selType'){R.type=t.value;changed();render();runCheck();toast('Rapor türü değişti. Bölüm yapısını bu türe göre kurmak için "Bölümleri bu türe göre yeniden kur"a basın.');return;}
    if(t.id==='chkAuto'){if(t.checked){store.set(AS_FLAG,'1');store.set(AS_KEY,JSON.stringify(R));toast('Taslak bu cihazda otomatik saklanacak.');}else{store.del(AS_FLAG);store.del(AS_KEY);toast('Otomatik saklama kapatıldı; cihazdaki kopya silindi.');}return;}
    if(t.dataset.thead){findBlock(R,t.dataset.thead).head=t.checked;changed();render();return;}
    if(t.dataset.ttot){findBlock(R,t.dataset.ttot).total=t.checked;changed();return;}
  });
  main.addEventListener('paste',e=>{
    const t=e.target;if(!t.dataset||!t.dataset.cell)return;const txt=(e.clipboardData||window.clipboardData).getData('text');if(!/[\t\n]/.test(txt))return;
    e.preventDefault();const[id,r,c]=t.dataset.cell.split('|');fillTable(findBlock(R,id),+r,+c,txt);changed();render();runCheck();toast('Tablo yapıştırıldı.');
  });
  main.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;const d=t.dataset;
    if(d.fix!=null){const i=ISS[+d.fix];if(i&&i.fix&&applyFix(R,i.fix)){changed();render();runCheck();toast('Düzeltildi.');}return;}
    if(d.go!=null){jump(ISS[+d.go].where);return;}
    if(t.id==='fixAll'){let n=0;for(let k=0;k<5;k++){const list=checkReport(R).filter(i=>i.fix);if(!list.length)break;for(const i of list)if(applyFix(R,i.fix))n++;}changed();runCheck();render();toast(n+' düzeltme yapıldı.');return;}
    if(t.id==='bRebuild'){if(!confirm('Bölümler seçili rapor türüne göre yeniden kurulacak; mevcut bölüm içerikleri silinecek. Devam edilsin mi?'))return;R.sections=TYPES[R.type].sec.map(mkSection);SEC=null;changed();runCheck();toast('Bölümler yeniden kuruldu.');return;}
    if(d.add){const M=R.meta;({mufettis:()=>M.mufettisler.push({ad:'',unvan:'Vergi Müfettişi'}),gorev:()=>M.gorevler.push({birim:M.daire||'',tarih:'',sayi:'',konu:''}),ortak:()=>M.ortaklar.push({ad:'',vkn:'',oran:''}),donem:()=>R.veriler.push({donem:''}),ek:()=>R.ekler.push({ad:'',sayfa:''})})[d.add]();changed();render();runCheck();return;}
    if(d.rm){const[p,i]=d.rm.split('|');const a=getP(p);a.splice(+i,1);if(p==='meta.mufettisler'&&!a.length)a.push({ad:'',unvan:'Vergi Müfettişi'});if(p==='meta.gorevler'&&!a.length)a.push({birim:'',tarih:'',sayi:'',konu:''});changed();render();runCheck();return;}
    if(d.mv){const[p,i,dir]=d.mv.split('|');const a=getP(p),j=+i+ +dir;if(j<0||j>=a.length)return;[a[+i],a[j]]=[a[j],a[+i]];changed();render();runCheck();return;}
    if(d.sid){SEC=d.sid;render();return;}
    if(d.sop){secOp(d.sop);return;}
    if(d.addb){const S=findSection(R,SEC);const b={id:uid(),type:d.addb,text:''};if(d.addb==='table'){b.rows=[['Açıklama','Tutar (TL)'],['','']];b.head=true;delete b.text;}S.blocks.push(b);changed();render();runCheck();setTimeout(()=>{const el=document.querySelector(`.blk[data-block="${b.id}"] textarea, .blk[data-block="${b.id}"] input[data-cell]`);if(el){el.focus();el.scrollIntoView({block:'center'});}},40);return;}
    if(d.bop){const[op,id]=d.bop.split('|');const S=blocksOf(id);const i=S.blocks.findIndex(b=>b.id===id);
      if(op==='del'){const b=S.blocks[i];const has=b.text?b.text.trim():b.rows&&b.rows.flat().some(c=>String(c).trim());if(has&&!confirm('Bu içerik silinsin mi?'))return;S.blocks.splice(i,1);}
      if(op==='up'&&i>0)[S.blocks[i-1],S.blocks[i]]=[S.blocks[i],S.blocks[i-1]];
      if(op==='down'&&i<S.blocks.length-1)[S.blocks[i+1],S.blocks[i]]=[S.blocks[i],S.blocks[i+1]];
      changed();render();runCheck();return;}
    if(d.top){const[op,id]=d.top.split('|');const b=findBlock(R,id);const nc=Math.max(1,...b.rows.map(r=>r.length));
      if(op==='addr')b.rows.push(new Array(nc).fill(''));if(op==='addc')b.rows.forEach(r=>r.push(''));if(op==='delr'&&b.rows.length>1)b.rows.pop();if(op==='delc'&&nc>1)b.rows.forEach(r=>r.pop());
      if(op==='paste'){const txt=prompt('Excel\'de hücreleri seçip kopyalayın, buraya yapıştırın (tablo baştan doldurulur):');if(!txt)return;b.rows=[];fillTable(b,0,0,txt);}
      changed();render();runCheck();return;}
    if(d.ins){const[op,id]=d.ins.split('|');const ta=document.querySelector(`textarea[data-btext="${id}"]`);if(!ta)return;
      if(op==='ref'){const ek=prompt('Ek numarası:','1');if(ek==null)return;const md=prompt('Tutanak madde numarası (boş bırakılabilir):','');insertAt(ta,` (Ek: ${ek.trim()} Tutanak${md&&md.trim()?' Md. '+md.trim():''})`,'','');}
      if(op==='b')insertAt(ta,'**','**','kalın metin');if(op==='i')insertAt(ta,'*','*','italik metin');if(op==='q')insertAt(ta,'“','”','ifade');return;}
    if(d.act){const S=findSection(R,SEC);const has=S.blocks.some(b=>(b.text||'').trim()||(b.rows&&b.rows.flat().some(c=>String(c).trim())));
      if(has&&!confirm('Bölümdeki mevcut içerik taslakla değiştirilsin mi?'))return;
      S.blocks=d.act==='giris'?girisTaslak(R):d.act==='sonuc'?sonucTaslak(R):[{id:uid(),type:'p',text:'Usul yönünden eleştirilecek bir husus tespit edilmemiştir.'}];
      changed();render();runCheck();toast('Taslak yazıldı; köşeli parantezli yerleri tamamlayın.');return;}
  });
  $('bWord').onclick=wordIndir;
  $('bSave').onclick=()=>{download(new Blob([JSON.stringify(R,null,1)],{type:'application/json'}),`rapor_taslak_${safeName(R.meta.mukellef.ad)||'yeni'}_${new Date().toISOString().slice(0,10)}.json`);dirty=false;toast('Taslak dosyası indirildi. "Taslak aç" ile kaldığınız yerden devam edebilirsiniz.');};
  $('bOpen').onclick=()=>$('fOpen').click();
  $('fOpen').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const o=JSON.parse(await f.text());if(!o||!Array.isArray(o.sections))throw new Error('Bu dosya bir rapor taslağı değil.');R=migrate(o);SEC=null;TAB='bilgi';dirty=false;if(autoOn())store.set(AS_KEY,JSON.stringify(R));render();runCheck();toast('Taslak açıldı.');}catch(err){toast('Taslak açılamadı: '+err.message);}};
  $('bNew').onclick=()=>{$('typeList').innerHTML=Object.entries(TYPES).map(([k,t])=>`<button data-nt="${k}">${hesc(t.label)}</button>`).join('');$('dlgType').showModal();};
  $('typeList').onclick=e=>{const b=e.target.closest('[data-nt]');if(!b)return;if(dirty&&!confirm('Kaydedilmemiş değişiklikler var. Yeni rapor başlatılsın mı?'))return;R=newReport(b.dataset.nt);SEC=null;TAB='bilgi';dirty=false;$('dlgType').close();if(autoOn())store.set(AS_KEY,JSON.stringify(R));render();runCheck();};
  $('dlgCancel').onclick=()=>$('dlgType').close();
  window.addEventListener('beforeunload',e=>{if(dirty&&!autoOn()){e.preventDefault();e.returnValue='';}});
}
if(typeof document!=='undefined')init();
</script>
